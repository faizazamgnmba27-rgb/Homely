name: homely
description: "HOMELY - Personal household management application. Your home. Your data. Your control."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & Navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Local Offline Database
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.2.3

  # UI, Charts & Typography
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  intl: ^0.19.0

  # Notifications
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4

  # File & Image Pickers (Local Storage)
  file_picker: ^10.3.8
  image_picker: ^1.1.2

  # Utilities
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - site/public/assets/
